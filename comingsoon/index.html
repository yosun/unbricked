<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Unbricked — the unexamined brick is not worth editing." />
  <title>Unbricked</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0d10;
      --fg: #e9eef5;
      --muted: #a6b1c2;
      --hairline: rgba(255,255,255,0.12);
      --glow: rgba(255,255,255,0.08);
      --max: 960px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #0b0d10;
        --muted: #475569;
        --hairline: rgba(2,6,23,0.14);
        --glow: rgba(2,6,23,0.06);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 30% 20%, var(--glow), transparent 60%),
                  radial-gradient(900px 500px at 80% 70%, var(--glow), transparent 55%),
                  var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .wrap {
      width: 100%;
      max-width: var(--max);
      border: 1px solid var(--hairline);
      border-radius: 20px;
      padding: 34px 30px;
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 54px);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .tagline {
      margin: 0 0 18px;
      font-size: clamp(16px, 2.2vw, 20px);
      color: var(--muted);
      line-height: 1.5;
    }
    .rule {
      height: 1px;
      background: var(--hairline);
      margin: 22px 0;
    }
    .mini {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .pill {
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 8px 10px;
    }
    footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--hairline); }
    a:hover { border-bottom-color: currentColor; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Unbricked</h1>
    <p class="tagline">the unexamined brick is not worth editing.</p>

```

  <span class="pill">layers as slices</span>
  <span class="pill">validated mutations</span>
</div>

<footer>
  <span>© <span id="y"></span> Unbricked</span>

</footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>

</body>
</html>
