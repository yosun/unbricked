<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbricked - Coming Soon</title>
    <style>
        /* Remove default margin and hide scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        /* Make the iframe fill the entire viewport */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="video-container">
<video
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  style="width:100vw;height:100vh;object-fit:cover;"
>
  <source src="/teaser.mp4" type="video/mp4" />
</video>
    </div>
</body>
</html>
